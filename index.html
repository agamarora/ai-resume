<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>{{PAGE_TITLE}}</title>
  <meta name="description" content="{{META_DESCRIPTION}}">
  <meta property="og:title" content="{{PAGE_TITLE}}">
  <meta property="og:description" content="{{META_DESCRIPTION}}">
  <meta property="og:url" content="{{OG_URL}}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{PAGE_TITLE}}">
  <meta name="twitter:description" content="{{META_DESCRIPTION}}">
  <style>
    :root {
      --bg: {{CSS_BG}};
      --border: {{CSS_BORDER}};
      --text: {{CSS_TEXT}};
      --text-dim: {{CSS_TEXT_DIM}};
      --accent: {{CSS_ACCENT}};
      --surface: {{CSS_SURFACE}};
      {{RGBA_VARIANTS}}
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      height: 100svh;
      display: flex;
      flex-direction: column;
    }

    .chat-header {
      flex-shrink: 0;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .chat-header h1 {
      font-size: 18px;
      font-weight: 600;
    }

    .mark {
      font-size: 20px;
      color: var(--accent);
      font-weight: 700;
    }

    .message-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 16px;
      line-height: 1.5;
      font-size: 15px;
      word-wrap: break-word;
      overflow-wrap: break-word;
      animation: fadeIn 0.2s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.assistant {
      align-self: flex-start;
      background: var(--surface);
      border: 1px solid var(--border);
    }

    .message.user {
      align-self: flex-end;
      background: var(--accent);
      color: var(--accent-fg, var(--bg));
    }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 4px 0;
    }

    .suggestion-chip {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 13px;
      color: var(--text-dim);
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }

    .suggestion-chip:hover {
      border-color: var(--accent);
      color: var(--text);
    }

    .retry-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 4px 12px;
      font-size: 13px;
      color: var(--text-dim);
      cursor: pointer;
      margin-top: 8px;
    }

    .retry-btn:hover {
      border-color: var(--accent);
      color: var(--text);
    }

    .message .cursor {
      display: inline-block;
      width: 2px;
      height: 1em;
      background: var(--accent);
      margin-left: 2px;
      vertical-align: text-bottom;
      animation: blink 1s step-end infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    .input-area {
      flex-shrink: 0;
      padding: 12px 16px;
      padding-bottom: max(12px, env(safe-area-inset-bottom));
      border-top: 1px solid var(--border);
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }

    .input-area textarea {
      flex: 1;
      resize: none;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 16px;
      font-family: inherit;
      background: var(--surface);
      color: var(--text);
      min-height: 44px;
      max-height: 140px;
      overflow-y: auto;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-area textarea:focus {
      border-color: var(--accent);
    }

    .input-area textarea::placeholder {
      color: var(--text-dim);
    }

    .send-btn {
      flex-shrink: 0;
      width: 44px;
      height: 44px;
      border-radius: 12px;
      border: none;
      background: var(--accent);
      color: var(--bg);
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.2s;
    }

    .send-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .send-btn:hover:not(:disabled) {
      opacity: 0.85;
    }

    .thinking-state {
      color: var(--text-dim);
      font-style: italic;
    }

    @media (max-width: 768px) {
      .message { max-width: 90%; }
      .input-area textarea { max-height: 100px; }
      .message-list { padding: 12px; }
    }
  </style>
</head>
<body>
  <header class="chat-header">
    <span class="mark">{{MARK_INITIALS}}.</span>
    <h1>{{HERO_NAME}}</h1>
  </header>

  <main class="message-list" id="messages" aria-live="polite">
    <!-- Welcome message inserted by JS -->
  </main>

  <div class="input-area">
    <textarea
      id="input"
      placeholder="{{PLACEHOLDER_TEXT}}"
      rows="1"
      aria-label="Ask {{HERO_NAME}}'s AI a question"
    ></textarea>
    <button class="send-btn" id="send" aria-label="Send message">&#x2191;</button>
  </div>

  <script>
    // === CONFIG ===
    const WELCOME = `{{WELCOME_MESSAGE}}`;
    const AUTO_QUESTIONS = {{AUTO_QUESTIONS_JSON}};
    const API_URL = "/.netlify/functions/groqHandler";
    const MAX_HISTORY = 6;
    const STREAM_THROTTLE_MS = 30;
    const REQUEST_TIMEOUT_MS = 15000;
    const SEND_COOLDOWN_MS = 2000;

    // === STATE ===
    const history = [];
    let isStreaming = false;
    let abortController = null;
    let lastSendTime = 0;

    // === DOM ===
    const messagesEl = document.getElementById("messages");
    const inputEl = document.getElementById("input");
    const sendBtn = document.getElementById("send");

    // === AUTO-SCROLL (from Loquix pattern) ===
    let isUserScrolled = false;
    let lastScrollTop = 0;

    messagesEl.addEventListener("scroll", () => {
      const { scrollTop, scrollHeight, clientHeight } = messagesEl;
      if (scrollTop < lastScrollTop) {
        isUserScrolled = true;
      }
      if (scrollHeight - scrollTop - clientHeight <= 50) {
        isUserScrolled = false;
      }
      lastScrollTop = scrollTop;
    }, { passive: true });

    function scrollToBottom() {
      if (!isUserScrolled) {
        requestAnimationFrame(() => {
          messagesEl.scrollTop = messagesEl.scrollHeight;
        });
      }
    }

    // === TEXTAREA AUTO-GROW (from Ultralytics pattern) ===
    inputEl.addEventListener("input", () => {
      inputEl.style.height = "auto";
      const maxH = window.innerWidth <= 768 ? 100 : 140;
      inputEl.style.height = `${Math.min(inputEl.scrollHeight, maxH)}px`;
      inputEl.style.overflowY = inputEl.scrollHeight > maxH ? "auto" : "hidden";
    });

    // === KEYBOARD HANDLING ===
    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
        e.preventDefault();
        sendMessage();
      }
    });

    sendBtn.addEventListener("click", sendMessage);

    // === MESSAGE RENDERING ===
    function addMessage(role, text) {
      const div = document.createElement("div");
      div.className = `message ${role}`;
      div.textContent = text;
      messagesEl.appendChild(div);
      scrollToBottom();
      return div;
    }

    function addStreamingMessage() {
      const div = document.createElement("div");
      div.className = "message assistant";
      const textNode = document.createTextNode("");
      const cursor = document.createElement("span");
      cursor.className = "cursor";
      div.appendChild(textNode);
      div.appendChild(cursor);
      messagesEl.appendChild(div);
      scrollToBottom();
      return { el: div, textNode, cursor };
    }

    // === STREAMING (30ms throttle from Ultralytics pattern) ===
    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text || isStreaming) return;
      const now = Date.now();
      if (now - lastSendTime < SEND_COOLDOWN_MS) return;
      lastSendTime = now;

      isStreaming = true;
      sendBtn.disabled = true;
      inputEl.value = "";
      inputEl.style.height = "auto";

      // Remove suggestion chips on first send
      const chips = messagesEl.querySelector(".suggestions");
      if (chips) chips.remove();

      addMessage("user", text);
      history.push({ role: "user", content: text });

      const msg = addStreamingMessage();
      let accumulated = "";
      let renderTimer = null;

      const scheduleRender = () => {
        if (renderTimer) return;
        renderTimer = setTimeout(() => {
          msg.textNode.textContent = accumulated;
          scrollToBottom();
          renderTimer = null;
        }, STREAM_THROTTLE_MS);
      };

      // "Still thinking..." timeout
      const thinkingTimer = setTimeout(() => {
        if (!accumulated) {
          msg.textNode.textContent = "still thinking...";
          msg.el.classList.add("thinking-state");
        }
      }, 5000);

      abortController = new AbortController();
      const timeout = setTimeout(() => abortController.abort(), REQUEST_TIMEOUT_MS);

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ input: text, history: history.slice(-MAX_HISTORY) }),
          signal: abortController.signal,
        });

        clearTimeout(timeout);

        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.error || `HTTP ${res.status}`);
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let lineBuf = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          lineBuf += decoder.decode(value, { stream: true });
          const lines = lineBuf.split("\n");
          lineBuf = lines.pop(); // keep incomplete trailing line in buffer
          for (const line of lines) {
            if (!line.startsWith("data: ")) continue;
            const data = line.slice(6);
            if (data === "[DONE]") continue;
            try {
              const parsed = JSON.parse(data);
              if (parsed.text) {
                accumulated += parsed.text;
                scheduleRender();
              }
              if (parsed.error) {
                throw new Error(parsed.error);
              }
            } catch (e) {
              if (e.message !== "Unexpected end of JSON input") throw e;
            }
          }
        }
      } catch (err) {
        if (err.name === "AbortError") {
          accumulated = "hmm, lost in thought. try again?";
        } else {
          accumulated = accumulated || "something went wrong. try again?";
          console.error("Stream error:", err);
        }
      }

      clearTimeout(thinkingTimer);
      if (renderTimer) clearTimeout(renderTimer);

      // Final render without cursor
      msg.textNode.textContent = accumulated;
      msg.el.classList.remove("thinking-state");
      if (msg.cursor.parentNode) msg.cursor.remove();

      // Add retry button on error responses
      if (accumulated.includes("try again?") || accumulated.includes("went wrong")) {
        const retryBtn = document.createElement("button");
        retryBtn.className = "retry-btn";
        retryBtn.textContent = "Retry";
        retryBtn.addEventListener("click", () => {
          msg.el.remove();
          history.pop(); // remove failed user message
          inputEl.value = text;
          sendMessage();
        });
        msg.el.appendChild(retryBtn);
      }

      history.push({ role: "assistant", content: accumulated });

      // Trim history
      while (history.length > MAX_HISTORY) history.shift();

      isStreaming = false;
      sendBtn.disabled = false;
      inputEl.focus();
      scrollToBottom();
    }

    // === INIT ===
    addMessage("assistant", WELCOME);

    // Suggestion chips below welcome message
    if (AUTO_QUESTIONS.length > 0) {
      const chipContainer = document.createElement("div");
      chipContainer.className = "suggestions";
      AUTO_QUESTIONS.slice(0, 3).forEach(q => {
        const chip = document.createElement("button");
        chip.className = "suggestion-chip";
        chip.textContent = q;
        chip.addEventListener("click", () => {
          inputEl.value = q;
          chipContainer.remove();
          sendMessage();
        });
        chipContainer.appendChild(chip);
      });
      messagesEl.appendChild(chipContainer);
      scrollToBottom();
    }

    // Auto-type placeholder rotation
    let questionIdx = 0;
    if (AUTO_QUESTIONS.length > 0) {
      setInterval(() => {
        if (document.activeElement !== inputEl && !inputEl.value) {
          questionIdx = (questionIdx + 1) % AUTO_QUESTIONS.length;
          inputEl.placeholder = AUTO_QUESTIONS[questionIdx];
        }
      }, 4000);
    }

    // iOS visual viewport handling
    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", () => {
        const vvh = window.visualViewport.height;
        document.body.style.height = `${vvh}px`;
      });
    }
  </script>
</body>
</html>
